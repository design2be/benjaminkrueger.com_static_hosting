<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Resources from Benjamin Krüger." />
    <title>Resources - Benjamin Krüger</title>
    <link rel="apple-touch-icon" sizes="180x180" href="./img/site/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./img/site/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./img/site/favicon-16x16.png" />
    <link rel="icon" href="./img/site/favicon.ico" />
    <link rel="manifest" href="./site.webmanifest" />
    <meta name="theme-color" content="#eef3f9" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@100..900&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #eef3f9;
        --text: #0f172a;
        --muted: #475569;
        --button: #0071e3;
        --surface: #ffffff;
        --shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
        font-family: "Public Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
      }

      main {
        width: min(920px, calc(100% - 32px));
        margin: 0 auto;
        padding: 56px 0;
      }

      .resource-header {
        margin: 0 0 28px 0;
        text-align: center;
      }

      .resource-header__avatar {
        display: block;
        width: 72px;
        height: 72px;
        margin: 0 auto 14px auto;
        border-radius: 50%;
        object-fit: cover;
      }

      h1 {
        margin: 0 0 10px 0;
        font-size: clamp(34px, 7vw, 56px);
        line-height: 1;
        letter-spacing: -0.05em;
      }

      .resource-header__intro {
        max-width: 620px;
        margin: 0 auto;
        color: var(--muted);
        font-size: 17px;
        line-height: 1.6;
      }

      .resource-list {
        display: grid;
        gap: 16px;
      }

      .resource-card {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 22px;
        border-radius: 20px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .resource-card__body {
        min-width: 0;
      }

      .resource-card__title {
        margin: 0 0 8px 0;
        font-size: 22px;
        line-height: 1.2;
      }

      .resource-card__desc {
        margin: 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.55;
      }

      .resource-card__button {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 12px 18px;
        border-radius: 999px;
        background: var(--button);
        color: #ffffff;
        font-size: 15px;
        font-weight: 700;
        text-decoration: none;
      }

      .resource-card__button:focus-visible {
        outline: 3px solid rgba(0, 113, 227, 0.28);
        outline-offset: 3px;
      }

      .resource-status {
        padding: 18px;
        border-radius: 16px;
        background: var(--surface);
        color: var(--muted);
        text-align: center;
      }

      .home-link {
        display: inline-block;
        margin: 26px auto 0 auto;
        color: var(--muted);
        font-size: 14px;
        text-decoration: none;
      }

      .home-link:hover {
        color: var(--text);
      }

      @media (max-width: 680px) {
        main {
          padding: 36px 0;
        }

        .resource-card {
          align-items: stretch;
          flex-direction: column;
        }

        .resource-card__button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header class="resource-header">
        <img
          class="resource-header__avatar"
          src="./img/benjamin_krueger.jpg"
          alt="Portrait of Benjamin Krüger"
          width="72"
          height="72"
        />
        <h1>Resources</h1>
        <p class="resource-header__intro">
          Thanks for confirming your email. Here are all current resources in one place.
        </p>
      </header>

      <section class="resource-list" id="resource-list" aria-label="Resources">
        <p class="resource-status">Loading resources...</p>
      </section>

      <p style="text-align:center;">
        <a class="home-link" href="./">Back to benjaminkrueger.com</a>
      </p>
    </main>

    <script>
      const list = document.getElementById("resource-list");

      function resourceUrl(resource) {
        const rawUrl = String(resource.resourceUrl || resource.resourcePath || "").trim();
        if (!rawUrl) return "";
        if (/^https?:\/\//i.test(rawUrl)) return rawUrl;
        return rawUrl.startsWith("/") ? rawUrl : `./${rawUrl}`;
      }

      function resourceTitle(resource) {
        return String(resource.resourceTitle || resource.overlayTitle || "Resource").trim();
      }

      function resourceDescription(resource) {
        return String(resource.resourceDescription || resource.overlayDescription || "").trim();
      }

      function renderResources(resources) {
        list.textContent = "";
        if (!resources.length) {
          const empty = document.createElement("p");
          empty.className = "resource-status";
          empty.textContent = "No resources are available right now.";
          list.append(empty);
          return;
        }

        for (const resource of resources) {
          const url = resourceUrl(resource);
          const card = document.createElement("article");
          card.className = "resource-card";

          const body = document.createElement("div");
          body.className = "resource-card__body";

          const title = document.createElement("h2");
          title.className = "resource-card__title";
          title.textContent = resourceTitle(resource);

          const desc = document.createElement("p");
          desc.className = "resource-card__desc";
          desc.textContent = resourceDescription(resource);

          const button = document.createElement("a");
          button.className = "resource-card__button";
          button.href = url || "./";
          button.textContent = "Open resource";
          if (/^https?:\/\//i.test(url)) {
            button.target = "_blank";
            button.rel = "noreferrer noopener";
          }

          body.append(title, desc);
          card.append(body, button);
          list.append(card);
        }
      }

      function visibleResources(resources) {
        return resources.filter((resource) => String(resource.id || "").trim() !== "early-access");
      }

      fetch("./data/resources.json", { cache: "no-store" })
        .then((response) => {
          if (!response.ok) throw new Error(`Failed to load resources (${response.status})`);
          return response.json();
        })
        .then((data) => {
          const resources = Array.isArray(data.resources) ? visibleResources(data.resources) : [];
          renderResources(resources);
        })
        .catch(() => {
          list.innerHTML = "";
          const error = document.createElement("p");
          error.className = "resource-status";
          error.textContent = "Resources could not be loaded. Please refresh the page.";
          list.append(error);
        });
    </script>
  </body>
</html>
